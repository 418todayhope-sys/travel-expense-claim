[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alderbridge-travel-claim"
version = "0.1.0"
description = "Alderbridge Consulting travel expense claim tooling"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20,<5", "openpyxl>=3.1,<4", "pypdf>=5,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
travel-claim = "travel_claim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
